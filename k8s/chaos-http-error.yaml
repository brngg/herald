apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: frontend-cart-http-abort
  namespace: default
spec:
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: frontend
  target: Request
  port: 8080
  method: GET
  path: /cart
  abort: true
  duration: "10m"
