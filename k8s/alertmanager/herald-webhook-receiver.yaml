apiVersion: v1
kind: ConfigMap
metadata:
  name: herald-webhook-receiver
  namespace: monitoring
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length).decode("utf-8", errors="replace")
            print("=== ALERTMANAGER WEBHOOK START ===", flush=True)
            print(f"path={self.path}", flush=True)
            print("headers=", flush=True)
            print(json.dumps(dict(self.headers), indent=2), flush=True)
            print("body=", flush=True)
            print(body, flush=True)
            print("=== ALERTMANAGER WEBHOOK END ===", flush=True)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(b'{"status":"ok"}')

        def log_message(self, format, *args):
            return

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: herald-webhook-receiver
  namespace: monitoring
  labels:
    app: herald-webhook-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: herald-webhook-receiver
  template:
    metadata:
      labels:
        app: herald-webhook-receiver
    spec:
      containers:
        - name: receiver
          image: python:3.11-alpine
          command:
            - python
            - /app/server.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: herald-webhook-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: herald-webhook-receiver
  namespace: monitoring
spec:
  selector:
    app: herald-webhook-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
