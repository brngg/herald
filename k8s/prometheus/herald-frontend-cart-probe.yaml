apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: herald-frontend-cart
  namespace: monitoring
  labels:
    release: monitoring
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: herald-blackbox-exporter.monitoring.svc.cluster.local:19115
  targets:
    staticConfig:
      static:
        - http://frontend.default.svc.cluster.local/cart
